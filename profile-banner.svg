<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Mark Jacob Nyumba — Data, AI and geospatial systems</title>
  <desc id="desc">A navy banner with teal topographic contours and the words Data, AI and geospatial systems. Building tools for practical decisions.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="0.6">
      <stop stop-color="#0c1727"/>
      <stop offset="1" stop-color="#102f38"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="280" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#background)"/>
    <g fill="none" stroke="#67e1c3" stroke-width="1.5" opacity="0.22">
      <ellipse cx="1070" cy="160" rx="104" ry="57" transform="rotate(-27 1070 160)"/>
      <ellipse cx="1070" cy="160" rx="143" ry="83" transform="rotate(-27 1070 160)"/>
      <ellipse cx="1070" cy="160" rx="183" ry="111" transform="rotate(-27 1070 160)"/>
      <ellipse cx="1070" cy="160" rx="226" ry="142" transform="rotate(-27 1070 160)"/>
      <ellipse cx="1070" cy="160" rx="273" ry="179" transform="rotate(-27 1070 160)"/>
      <ellipse cx="1070" cy="160" rx="321" ry="218" transform="rotate(-27 1070 160)"/>
    </g>
    <rect x="52" y="46" width="42" height="4" rx="2" fill="#8af0d1"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="52" y="91" fill="#8af0d1" font-size="20" letter-spacing="3">MARK JACOB NYUMBA</text>
      <text x="52" y="153" fill="#f0f7fb" font-size="45" font-weight="600">Data, AI &amp; geospatial systems.</text>
      <text x="52" y="201" fill="#c6d7df" font-size="25">Building tools for practical decisions.</text>
      <text x="52" y="245" fill="#a9c4ce" font-size="17" letter-spacing="1.5">NAIROBI, KENYA · BEMOREMJ</text>
    </g>
  </g>
</svg>
